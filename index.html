<style>
  :root { --bg: #070a14; --fg: #eef1f8; --mut: #a9b3cc; --acc: #9cbaff; }

<main>
  <h1>Aurora TV</h1>
  <p>Aurora é uma tela inicial pessoal para Android TV. Mostra manchetes de tecnologia e ciência de feeds RSS públicos e os vídeos novos dos canais do YouTube em que o usuário está inscrito.</p>
  <p>É um projeto pessoal, sem fins comerciais, usado em uma única TV.</p>
